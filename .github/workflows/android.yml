name: Android build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest
      - name: Build APK debug
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: luciole-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK en téléchargement direct
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk luciole.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk luciole.apk \
            --target "$GITHUB_SHA" \
            --title "Luciole (dernière version)" \
            --notes "APK de test, reconstruit à chaque modification."
